apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: lab-relay-server
  namespace: default
  labels:
    app.kubernetes.io/part-of: sprint5-day9
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sprint5-day9
    spec:
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7654
      template:
        spec:
          nodeSelector:
            role: gameserver-lab
          tolerations:
            - key: sprint5-lab
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: relay
              image: <ACR-NAME>.azurecr.io/cnp-day9-relay:0.1.0  # replace with your registry
              resources:
                requests: {memory: 64Mi, cpu: 20m}
                limits: {memory: 64Mi, cpu: 20m}
