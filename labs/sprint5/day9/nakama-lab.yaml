apiVersion: v1
kind: Namespace
metadata:
  name: nakama-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: nakama-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nakama-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sprint5-day9
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nakama-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sprint5-day9
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: sprint5-day9
    spec:
      nodeSelector:
        role: gameserver-lab
      tolerations:
        - key: sprint5-lab
          operator: Equal
          value: "true"
          effect: NoSchedule
      serviceAccountName: postgres
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nakama
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nakama-db
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nakama
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nakama
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: default
        resources:
          requests:
            storage: 4Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nakama
  namespace: nakama-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: nakama
  namespace: nakama-lab
  labels:
    app.kubernetes.io/name: nakama
    app.kubernetes.io/part-of: sprint5-day9
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nakama
  ports:
    - name: grpc
      port: 7349
      targetPort: grpc
    - name: http
      port: 7350
      targetPort: http
    - name: console
      port: 7351
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama
  namespace: nakama-lab
  labels:
    app.kubernetes.io/name: nakama
    app.kubernetes.io/part-of: sprint5-day9
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nakama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nakama
        app.kubernetes.io/part-of: sprint5-day9
    spec:
      nodeSelector:
        role: gameserver-lab
      tolerations:
        - key: sprint5-lab
          operator: Equal
          value: "true"
          effect: NoSchedule
      serviceAccountName: nakama
      automountServiceAccountToken: true
      initContainers:
        - name: migrate
          image: heroiclabs/nakama:3.40.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DB_ADDR="postgres:${POSTGRES_PASSWORD}@postgres.nakama-lab.svc.cluster.local:5432/nakama"
              /nakama/nakama migrate up --database.address "$DB_ADDR"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nakama-db
                  key: postgres-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: nakama
          image: heroiclabs/nakama:3.40.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DB_ADDR="postgres:${POSTGRES_PASSWORD}@postgres.nakama-lab.svc.cluster.local:5432/nakama"
              K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              exec /nakama/nakama --name nakama-lab --database.address "$DB_ADDR" --logger.level INFO --session.token_expiry_sec 7200 --runtime.path /nakama/data/modules --runtime.env "K8S_TOKEN=${K8S_TOKEN}" --runtime.env "QUILKIN_ENDPOINT=${QUILKIN_ENDPOINT}" --runtime.env "FLEET_NAME=lab-relay-server"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nakama-db
                  key: postgres-password
            - name: QUILKIN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: nakama-lab-env
                  key: quilkin-endpoint
          volumeMounts:
            - name: runtime-modules
              mountPath: /nakama/data/modules/main.lua
              subPath: main.lua
              readOnly: true
          ports:
            - name: grpc
              containerPort: 7349
            - name: http
              containerPort: 7350
            - name: console
              containerPort: 7351
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /nakama/nakama
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /nakama/nakama
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: runtime-modules
          configMap:
            name: nakama-lab-module
