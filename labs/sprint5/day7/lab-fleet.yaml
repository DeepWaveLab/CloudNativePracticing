apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: lab-game-server
  namespace: default
  labels:
    app.kubernetes.io/part-of: sprint5-day8
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sprint5-day8
    spec:
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7654
      template:
        spec:
          nodeSelector:
            role: gameserver-lab
          tolerations:
            - key: sprint5-lab
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: simple-game-server
              image: us-docker.pkg.dev/agones-images/examples/simple-game-server:0.43
              resources:
                requests: {memory: 64Mi, cpu: 20m}
                limits: {memory: 64Mi, cpu: 20m}
