apiVersion: v1
kind: ServiceAccount
metadata:
  name: nakama
  namespace: nakama
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: nakama
  namespace: nakama
  labels:
    app.kubernetes.io/name: nakama
    app.kubernetes.io/part-of: sprint5-day5
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nakama
  ports:
    - name: grpc
      port: 7349
      targetPort: grpc
    - name: http
      port: 7350
      targetPort: http
    - name: console
      port: 7351
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama
  namespace: nakama
  labels:
    app.kubernetes.io/name: nakama
    app.kubernetes.io/part-of: sprint5-day5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nakama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nakama
        app.kubernetes.io/part-of: sprint5-day5
    spec:
      serviceAccountName: nakama
      initContainers:
        - name: migrate
          image: heroiclabs/nakama:3.40.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DB_ADDR="postgres:${POSTGRES_PASSWORD}@postgres.nakama.svc.cluster.local:5432/nakama"
              /nakama/nakama migrate up --database.address "$DB_ADDR"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nakama-db
                  key: postgres-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: nakama
          image: heroiclabs/nakama:3.40.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              DB_ADDR="postgres:${POSTGRES_PASSWORD}@postgres.nakama.svc.cluster.local:5432/nakama"
              exec /nakama/nakama --name nakama-0 --database.address "$DB_ADDR" --logger.level INFO --session.token_expiry_sec 7200
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nakama-db
                  key: postgres-password
          ports:
            - name: grpc
              containerPort: 7349
            - name: http
              containerPort: 7350
            - name: console
              containerPort: 7351
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /nakama/nakama
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /nakama/nakama
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
