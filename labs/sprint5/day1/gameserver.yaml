apiVersion: agones.dev/v1
kind: GameServer
metadata:
  generateName: simple-game-server-
spec:
  ports:
    - name: default
      portPolicy: Dynamic          # Agones 配隨機 hostPort(Day 0 gate 3)
      containerPort: 7654
  template:
    spec:
      nodeSelector:
        role: gameserver           # 釘在有公網 IP 的 game-server 節點池(spike S1)
      containers:
        - name: simple-game-server
          image: us-docker.pkg.dev/agones-images/examples/simple-game-server:0.43
          resources:
            requests: {memory: 64Mi, cpu: 20m}
            limits: {memory: 64Mi, cpu: 20m}
