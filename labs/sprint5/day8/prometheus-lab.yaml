apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-lab-discovery
  namespace: default
  labels:
    app.kubernetes.io/part-of: sprint5-day7
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-lab-discovery
  namespace: default
  labels:
    app.kubernetes.io/part-of: sprint5-day7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-lab-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-lab-discovery
  namespace: agones-system
  labels:
    app.kubernetes.io/part-of: sprint5-day7
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-lab-discovery
  namespace: agones-system
  labels:
    app.kubernetes.io/part-of: sprint5-day7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-lab-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: agones-controller
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agones-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_agones_dev_role]
            regex: controller
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8080"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: quilkin-proxies
        fallback_scrape_protocol: PrometheusText0.0.4
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_role]
            regex: proxy
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        role: gameserver-lab
      tolerations:
        - key: sprint5-lab
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=12h
          ports:
            - containerPort: 9090
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
