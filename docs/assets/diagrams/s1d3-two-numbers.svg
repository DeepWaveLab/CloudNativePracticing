="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">torch：total_MiB= 4096</text><line x1="410" y1="106" x2="410" y2="140" stroke="#222" stroke-width="1.4"/><line x1="410" y1="190" x2="410" y2="226" stroke="#222" stroke-width="1.4"/><rect x="520" y="20" width="180" height="84" rx="6" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="610" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">slice-c</text><text x="610" y="64.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">nvidia-smi：4096MiB</text><text x="610" y="86.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">torch：total_MiB= 4096</text><line x1="610" y1="106" x2="610" y2="140" stroke="#222" stroke-width="1.4"/><line x1="610" y1="190" x2="610" y2="226" stroke="#222" stroke-width="1.4"/><rect x="120" y="140" width="580" height="50" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="410" y="165.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">libvgpu.so（每個容器各載入一份）：查詢總量時回報配額 4096 MiB</text><rect x="120" y="226" width="580" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="410" y="248.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">同一張 Tesla T4</text><text x="410" y="272.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">宿主機查到的 memory.total：16384 MiB</text><text x="360" y="314.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">三個容器共用一張卡，各自只看到自己的 4096 MiB，也看不到彼此的行程。</text></svg>