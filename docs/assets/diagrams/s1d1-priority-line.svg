<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="250" fill="#fff"/><line x1="60" y1="120" x2="660" y2="120" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><line x1="180.0" y1="112" x2="180.0" y2="128" stroke="#222" stroke-width="1.6"/><text x="180.0" y="145.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">50</text><text x="180.0" y="168.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">train</text><line x1="300.0" y1="112" x2="300.0" y2="128" stroke="#222" stroke-width="1.6"/><text x="300.0" y="145.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">75</text><text x="300.0" y="168.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">build-preemptible</text><line x1="420.0" y1="112" x2="420.0" y2="128" stroke="#222" stroke-width="1.6"/><text x="420.0" y="145.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">100</text><text x="420.0" y="168.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">build</text><line x1="540.0" y1="112" x2="540.0" y2="128" stroke="#222" stroke-width="1.6"/><text x="540.0" y="145.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">125</text><text x="540.0" y="168.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">inference</text><line x1="396.0" y1="40" x2="396.0" y2="200" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5"/><text x="396.0" y="30.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#c0392b">100 以上不會被搶占</text><rect x="60" y="60" width="326.0" height="36" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="228.0" y="78.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">可以被搶占，可以借用超額資源</text><rect x="406.0" y="60" width="254.0" height="36" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="533.0" y="78.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">不會被搶占，只能用 quota 內</text><text x="360" y="222.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">PriorityClass 的數值決定 workload 落在哪一邊；佇列名稱和 queue priority 不影響這件事。</text></svg>