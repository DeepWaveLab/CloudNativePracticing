<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="330" fill="#fff"/><text x="20" y="30.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">一次 read() 在核心裡經過的位置，由左到右是時間順序</text><rect x="20" y="60" width="140" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="90.0" y="83.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">行程呼叫</text><text x="90.0" y="100.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">read()</text><rect x="190" y="60" width="180" height="64" rx="4" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="280.0" y="83.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">LSM 權限檢查</text><text x="280.0" y="100.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">security_file_permission</text><rect x="390" y="60" width="140" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460.0" y="83.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">核心讀出</text><text x="460.0" y="100.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">檔案內容</text><rect x="560" y="60" width="140" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="630.0" y="83.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">回到使用者空間</text><text x="630.0" y="100.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">程式拿到資料</text><line x1="162" y1="92" x2="186" y2="92" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="372" y1="92" x2="386" y2="92" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="532" y1="92" x2="556" y2="92" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="250" y1="126" x2="250" y2="166" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="140" y="170" width="280" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="280" y="190.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Sigkill：送出訊號</text><text x="280" y="214.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">回使用者空間之前就結束行程</text><rect x="440" y="170" width="260" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="570" y="190.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Override：改寫回傳值</text><text x="570" y="214.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">這次 read() 直接回 EPERM</text><line x1="330" y1="126" x2="520" y2="166" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="20" y="270.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">兩個動作都掛在讀取之前的檢查點，所以檔案內容都沒有機會離開行程。</text><text x="20" y="296.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">同樣的動作若掛在操作完成之後才觸發的地方，資料可能已經寫出或送出。</text></svg>