<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="470" fill="#fff"/><text x="360" y="22.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">由上而下拆，每拆一層取一次節點快照</text><rect x="40" y="44" width="440" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="62" y="66.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">1</text><text x="84" y="66.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">SpinApp、測試 Deployment</text><line x1="260" y1="90" x2="260" y2="100" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="66.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點快照不變</text><rect x="40" y="102" width="440" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="62" y="124.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">2</text><text x="84" y="124.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">SpinAppExecutor（要趁 operator 還在時刪）</text><line x1="260" y1="148" x2="260" y2="158" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="124.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點快照不變</text><rect x="40" y="160" width="440" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="62" y="182.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">3</text><text x="84" y="182.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">spin-operator chart、CRD、namespace</text><line x1="260" y1="206" x2="260" y2="216" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="182.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點快照不變</text><rect x="40" y="218" width="440" height="44" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="62" y="240.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">4</text><text x="84" y="240.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Shim CR → uninstall Job</text><line x1="260" y1="264" x2="260" y2="274" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="240.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#b26a00">動到節點</text><rect x="40" y="276" width="440" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="62" y="298.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">5</text><text x="84" y="298.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">runtime-class-manager chart、Shim CRD</text><line x1="260" y1="322" x2="260" y2="332" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="298.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點快照不變</text><rect x="40" y="334" width="440" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="62" y="356.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">6</text><text x="84" y="356.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">cert-manager chart、CRD</text><line x1="260" y1="380" x2="260" y2="390" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="356.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點快照不變</text><rect x="40" y="392" width="440" height="44" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="62" y="414.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">7</text><text x="84" y="414.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">手動收尾（設定、目錄、標籤）</text><text x="500" y="414.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#b26a00">動到節點</text></svg>