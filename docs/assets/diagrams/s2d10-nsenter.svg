<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="500" fill="#fff"/><rect x="30" y="30" width="240" height="150" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="150" y="52.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">攻擊者的特權 pod</text><rect x="55" y="116" width="190" height="44" rx="0" fill="#d4d4d4" stroke="#f0a020" stroke-width="2"/><text x="150" y="138.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">cgroup A</text><rect x="450" y="30" width="240" height="150" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="570" y="52.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">目標 pod</text><rect x="475" y="68" width="190" height="36" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="570" y="86.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">cgroup B</text><rect x="475" y="116" width="190" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="570" y="132.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">命名空間 B</text><text x="570" y="147.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">網路、檔案系統、行程</text><ellipse cx="360" cy="236" rx="96" ry="30" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="228.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">攻擊者的行程</text><text x="360" y="243.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">cat /etc/shadow</text><line x1="420" y1="214" x2="540" y2="166" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="222.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">nsenter 換進來</text><line x1="305" y1="212" x2="205" y2="162" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="232" y="210.0" font-size="12" text-anchor="end" dominant-baseline="middle" font-weight="normal" fill="#b26a00">cgroup 沒換</text><line x1="10" y1="290" x2="710" y2="290" stroke="#222" stroke-width="1.1" stroke-dasharray="7 6"/><text x="360" y="312.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">各套工具用什麼認人，就得到什麼答案</text><rect x="30" y="330" width="320" height="156" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="46" y="350.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">依 cgroup 認人</text><text x="46" y="382.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">bpftrace 綁 pod 的過濾器：完全看不到</text><text x="46" y="408.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Falco、Tetragon 偵測：看得到，記在 A 名下</text><text x="46" y="434.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Tetragon 綁在 B 的攔截：沒有觸發，</text><text x="70" y="460.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">檔案照樣被讀走</text><rect x="370" y="330" width="320" height="156" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="386" y="350.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">依網路介面認人</text><text x="386" y="382.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Cilium 政策：套用 B 的政策；</text><text x="410" y="408.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">B 權限較少時，能做的事也變少</text><text x="386" y="434.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Hubble：flow 記在 B 名下，</text><text x="410" y="460.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">看不出是誰發的</text></svg>