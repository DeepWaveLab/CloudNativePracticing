<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="400" fill="#fff"/><ellipse cx="360" cy="36" rx="130" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="36.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">uninstall Job 開始</text><line x1="300" y1="58" x2="180" y2="96" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="420" y1="58" x2="540" y2="96" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="40" y="98" width="280" height="66" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="120.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">刪 shim 二進位檔</text><text x="180" y="144.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">照 rcm-lock.json 記的絕對路徑</text><rect x="400" y="98" width="280" height="66" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="540" y="120.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">刪 config.toml 那一段</text><text x="540" y="144.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">用 rcm 自己產生的整段文字去比對</text><text x="16" y="200.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">情境 A</text><text x="16" y="220.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">設定沒手改</text><text x="16" y="290.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">情境 B</text><text x="16" y="310.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">手改過 domain</text><line x1="10" y1="250" x2="710" y2="250" stroke="#222" stroke-width="1.1" stroke-dasharray="7 6"/><rect x="110" y="186" width="210" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="215" y="211.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">檔案刪掉</text><rect x="400" y="186" width="280" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="540" y="211.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">比對命中，整段刪掉</text><rect x="110" y="276" width="210" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="215" y="301.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">檔案刪掉</text><rect x="400" y="276" width="280" height="50" rx="0" fill="#fff" stroke="#f0a020" stroke-width="2"/><text x="540" y="301.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">比對不命中，一個字都沒刪</text><text x="360" y="360.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">兩個情境的 Job 都是 Complete、退出碼 0，都會重啟 containerd</text><text x="360" y="384.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">情境 B 留下：設定還宣告 spin-v2，指向的檔案已經不在</text></svg>