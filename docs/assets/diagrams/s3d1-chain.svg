<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="600" fill="#fff"/><rect x="170" y="20" width="460" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="190" y="37.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">①</text><text x="400" y="37.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Pod 宣告要用哪個 RuntimeClass</text><text x="400" y="58.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">runtimeClassName: wasm-day1-runc</text><line x1="400" y1="72" x2="400" y2="96" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="170" y="98" width="460" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="190" y="115.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">②</text><text x="400" y="115.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">RuntimeClass 指向哪個 handler</text><text x="400" y="136.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">handler: runc</text><line x1="400" y1="150" x2="400" y2="204" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="170" y="206" width="460" height="52" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="190" y="223.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">③</text><text x="400" y="223.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">kubelet 經由 CRI 把 handler 交給 containerd</text><text x="400" y="244.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">sandbox 的 runtimeHandler = runc</text><line x1="400" y1="258" x2="400" y2="312" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="170" y="314" width="460" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="190" y="331.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">④</text><text x="400" y="331.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">config.toml 裡這個 handler 的區塊</text><text x="400" y="352.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">runtimes.runc</text><line x1="400" y1="366" x2="400" y2="390" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="170" y="392" width="460" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="190" y="409.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">⑤</text><text x="400" y="409.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">區塊宣告用哪一種 shim</text><text x="400" y="430.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">runtime_type = io.containerd.runc.v2</text><line x1="400" y1="444" x2="400" y2="468" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="170" y="470" width="460" height="52" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="190" y="487.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">⑥</text><text x="400" y="487.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">shim 要呼叫的執行檔</text><text x="400" y="508.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">BinaryName = /usr/bin/runc</text><line x1="400" y1="522" x2="400" y2="546" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="400" cy="570" rx="210" ry="24" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="400" y="570.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">⑦ 節點上實際啟動的行程：containerd-shim-runc-v2</text><line x1="10" y1="175" x2="710" y2="175" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><line x1="10" y1="287" x2="710" y2="287" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="81.55" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#555">叢集</text><text x="20" y="98.45" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#555">（etcd）</text><text x="20" y="232.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#555">交接</text><text x="20" y="430.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#555">節點</text></svg>