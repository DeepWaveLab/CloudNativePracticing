<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="430" fill="#fff"/><rect x="20" y="20" width="300" height="96" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="170" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">AKS 的 config.toml</text><text x="170" y="66.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">第一行：version = 2</text><text x="170" y="90.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">內容：io.containerd.cri.v1.runtime</text><rect x="400" y="20" width="300" height="96" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="550" y="42.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">rcm 的判斷</text><text x="550" y="68.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">檔案裡有沒有 "version = 3"？</text><text x="550" y="92.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">沒有 → 當成 containerd 1.x</text><line x1="322" y1="68" x2="398" y2="68" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="400" y="160" width="300" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="550" y="180.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">寫入 1.x 路徑</text><text x="550" y="202.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">io.containerd.grpc.v1.cri</text><line x1="550" y1="118" x2="550" y2="158" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="160" width="300" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="170" y="180.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">containerd 2.3.3 讀 runtime 的地方</text><text x="170" y="202.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">io.containerd.cri.v1.runtime</text><rect x="400" y="270" width="300" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="550" y="290.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">解析結果沒有該 handler</text><text x="550" y="312.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">沒有錯誤，也沒有警告</text><line x1="550" y1="222" x2="550" y2="268" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="270" width="300" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="170" y="290.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">修正：把那兩行的路徑</text><text x="170" y="312.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">換成 io.containerd.cri.v1.runtime</text><line x1="170" y1="268" x2="170" y2="222" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="370.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">判斷的依據是設定檔裡的字串，不是 containerd 的版本。</text><text x="360" y="398.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">AKS 的檔案宣告 version = 2，內容卻已經是 2.x 的寫法，所以判斷落在錯的一邊。</text></svg>