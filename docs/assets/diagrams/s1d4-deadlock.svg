<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="330" fill="#fff"/><rect x="30" y="30" width="300" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">① KAI binder 建一顆佔位 pod</text><text x="180" y="78.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">向節點請求 nvidia.com/gpu: 1</text><rect x="390" y="30" width="300" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="540" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">② kubelet 找節點上的 device plugin</text><text x="540" y="78.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">要它配一個 GPU（Allocate）</text><rect x="390" y="190" width="300" height="70" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="540" y="214.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">③ 供應者是 HAMi 的 device plugin</text><text x="540" y="238.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">只服務 hami-scheduler 配過的 pod</text><rect x="30" y="190" width="300" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="214.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">④ 回 no binding pod found</text><text x="180" y="238.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">佔位失敗，綁定失敗，KAI 重排</text><line x1="332" y1="65" x2="388" y2="65" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="540" y1="102" x2="540" y2="188" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="388" y1="225" x2="332" y2="225" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="180" y1="188" x2="180" y2="102" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="360" y="145.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">不停重複</text><text x="360" y="300.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">KAI 的 pod 一張卡都拿不到；HAMi 那邊的 pod 照常執行。</text></svg>