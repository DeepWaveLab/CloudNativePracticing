 x="440" y="20" width="260" height="280" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="7 5"/><text x="570" y="40.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">echo7 的 policy map</text><rect x="455" y="58" width="230" height="50" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="570" y="75.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">app=client：8080/TCP 只准 GET</text><text x="570" y="93.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">GET 200、POST 403</text><rect x="455" y="138" width="230" height="50" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="570" y="155.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">沒有符合的條目</text><text x="570" y="173.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">丟棄，呼叫端逾時</text><rect x="455" y="232" width="230" height="50" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="570" y="249.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">reserved:host：ANY</text><text x="570" y="267.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">全部放行，POST 也 200</text><line x1="302" y1="65" x2="453" y2="83" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="370" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">identity 6874</text><line x1="302" y1="163" x2="453" y2="163" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="377" y="152.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">identity 17242</text><line x1="302" y1="261" x2="453" y2="257" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="377" y="247.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">reserved:host</text><text x="360" y="328.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">政策掛在每顆 pod 的 veth 上：封包從哪個網路命名空間出發，就帶著那裡的身分。</text></svg>