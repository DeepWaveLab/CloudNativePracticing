<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="370" fill="#fff"/><text x="20" y="68.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">各排各的</text><text x="20" y="96.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">每顆 pod 獨立排程</text><rect x="170" y="30" width="130" height="100" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="235" y="48.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">T4 #1</text><ellipse cx="235" cy="82" rx="50" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="235" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 1</text><text x="235" y="114.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Running，等同伴</text><rect x="315" y="30" width="130" height="100" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="48.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">T4 #2</text><ellipse cx="380" cy="82" rx="50" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="380" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 2</text><text x="380" y="114.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Running，等同伴</text><rect x="465" y="30" width="240" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="585" y="48.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">排不上的</text><ellipse cx="585" cy="82" rx="50" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="585" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 3</text><text x="585" y="114.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Pending，等一張卡</text><text x="170" y="152.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">兩張卡被佔著，前兩個 worker 等不到同伴，第三個等不到卡：沒有任何進度。</text><text x="20" y="238.0" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">gang scheduling</text><text x="20" y="266.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">湊不齊就一顆都不排</text><rect x="170" y="200" width="130" height="100" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="235" y="218.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">T4 #1</text><text x="235" y="252.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">空著</text><text x="235" y="278.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">別的工作可以用</text><rect x="315" y="200" width="130" height="100" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="380" y="218.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">T4 #2</text><text x="380" y="252.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">空著</text><text x="380" y="278.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">別的工作可以用</text><rect x="465" y="200" width="240" height="100" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="585" y="218.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">PodGroup（minMember 3）</text><ellipse cx="505" cy="252" rx="36" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="505" y="252.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 1</text><ellipse cx="585" cy="252" rx="36" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="585" y="252.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 2</text><ellipse cx="665" cy="252" rx="36" ry="16" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="665" y="252.0" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">worker 3</text><text x="585" y="284.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">三個一起 Pending</text><text x="170" y="322.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">三個 worker 一起等，兩張卡留給別的工作；湊得齊時，三個再一起排上。</text></svg>