<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="410" fill="#fff"/><rect x="30" y="20" width="300" height="320" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="44.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">gpuspot 節點池（Day 3–5 用的）</text><rect x="46" y="66" width="88.48" height="22" rx="0" fill="#555" stroke="#555" stroke-width="1.4"/><text x="90.24000000000001" y="77.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#fff">pool=gpu</text><rect x="142.48000000000002" y="66" width="72.36" height="22" rx="0" fill="#555" stroke="#555" stroke-width="1.4"/><text x="178.66000000000003" y="77.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#fff">gpu=on</text><text x="46" y="108.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點上的 DaemonSet：</text><ellipse cx="180" cy="142" rx="124" ry="20" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="142.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">HAMi device plugin</text><ellipse cx="180" cy="190" rx="124" ry="20" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="190.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">dcgm-exporter（HAMi-WebUI）</text><ellipse cx="180" cy="238" rx="124" ry="20" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="180" y="238.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">映像預熱 DaemonSet</text><rect x="60" y="282" width="240" height="40" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="180" y="302.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Tesla T4（/dev/nvidia*）</text><rect x="390" y="20" width="300" height="320" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="540" y="44.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">gpudra 節點池（本章新開）</text><rect x="406" y="66" width="112.66000000000001" height="22" rx="0" fill="#555" stroke="#555" stroke-width="1.4"/><text x="462.33" y="77.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#fff">pool=gpudra</text><text x="406" y="108.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點上的 DaemonSet：</text><ellipse cx="540" cy="142" rx="124" ry="20" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="540" y="142.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">DRA kubelet plugin</text><rect x="420" y="282" width="240" height="40" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="540" y="302.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Tesla T4（/dev/nvidia*）</text><line x1="360" y1="30" x2="360" y2="330" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5"/><text x="360" y="362.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#c0392b">兩種 plugin 都會動同一組 /dev/nvidia*，所以不放在同一台節點上</text><text x="360" y="390.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">gpudra 只貼 pool=gpudra，既有 DaemonSet 的 selector 都對不上，自然不會落在這裡</text></svg>