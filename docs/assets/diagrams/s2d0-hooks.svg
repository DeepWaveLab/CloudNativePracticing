<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="350" fill="#fff"/><text x="20" y="60.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">使用者空間</text><text x="20" y="140.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">syscall 邊界</text><line x1="10" y1="100" x2="710" y2="100" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="220.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">核心函式</text><line x1="10" y1="180" x2="710" y2="180" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="300.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">網路與 cgroup</text><line x1="10" y1="260" x2="710" y2="260" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="140" y="30" width="560" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="420" y="50.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">uprobe：掛在某個執行檔裡的函式上</text><text x="420" y="72.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">數量看檔案而定，/bin/bash 一個檔就有 1,671 個</text><rect x="140" y="110" width="270" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="130.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">tracepoint:syscalls</text><text x="275" y="152.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">712 個，每種 syscall 各自分開</text><rect x="430" y="110" width="270" height="60" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="565" y="130.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">raw_syscalls:sys_enter</text><text x="565" y="152.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">每一次 syscall 都命中</text><rect x="140" y="190" width="270" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="210.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kprobe</text><text x="275" y="232.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">66,121 個核心函式</text><rect x="430" y="190" width="270" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="565" y="210.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kfunc（透過 BTF 拿型別）</text><text x="565" y="232.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">63,265 個核心函式</text><rect x="140" y="270" width="270" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="290.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">XDP、tc（網路路徑）</text><text x="275" y="312.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">本課節點上：0 支</text><rect x="430" y="270" width="270" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="565" y="290.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cgroup</text><text x="565" y="312.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">systemd 已經掛了 47 支</text></svg>