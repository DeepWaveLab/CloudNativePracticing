<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="330" fill="#fff"/><text x="20" y="75.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">核心模組</text><text x="20" y="225.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">eBPF</text><line x1="10" y1="150" x2="710" y2="150" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="110" y="40" width="150" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="185" y="64.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">任意核心程式碼</text><text x="185" y="88.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">編成 .ko</text><rect x="310" y="40" width="160" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="390" y="64.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">modprobe</text><text x="390" y="88.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">可驗簽章，無程式分析</text><rect x="520" y="40" width="180" height="70" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="610" y="64.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">直接成為</text><text x="610" y="88.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">核心的一部分</text><line x1="262" y1="75" x2="306" y2="75" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="472" y1="75" x2="516" y2="75" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="110" y="128.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">模組載入不經 eBPF verifier 的程式安全分析</text><rect x="110" y="190" width="150" height="70" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="185" y="214.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">受限的指令集</text><text x="185" y="238.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">寫成的程式</text><rect x="310" y="190" width="160" height="70" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="390" y="214.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">verifier</text><text x="390" y="238.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">逐條模擬執行</text><rect x="520" y="170" width="180" height="44" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="610" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">通過：JIT 後掛上</text><rect x="520" y="236" width="180" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="610" y="258.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">不通過：載入失敗</text><line x1="262" y1="225" x2="306" y2="225" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="472" y1="212" x2="516" y2="194" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="472" y1="238" x2="516" y2="256" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="110" y="305.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">例：少設一個回傳值，核心回 R0 !read_ok，拒絕載入</text></svg>