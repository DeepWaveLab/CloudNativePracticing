site_name: Cloud Native Lab Course
site_description: 雲原生實作課程 —— GPU 排程 runbook、踩雷解法與反思
copyright: KAI Scheduler、HAMi、Kubernetes 標誌為 CNCF(Linux Foundation)官方資產,作社群教學用途
site_url: https://deepwavelab.github.io/CloudNativePracticing/

theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search

extra_css:
  - stylesheets/terminal.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

exclude_docs: |
  plans/
  reviews/
  assets/SOURCES.md

nav:
  - 首頁:
      - 課程總覽: index.md
      - "Sprint 1 · GPU 排程三部曲 介紹": sprints/sprint1.md
      - "Sprint 2 · eBPF 與執行期安全 介紹": sprints/sprint2.md
      - "Sprint 3 · WebAssembly 介紹": sprints/sprint3.md

  - "Sprint 1 · GPU 排程三部曲":
      - "Day 0 · 環境建置與成本紀律": runbook/sprint1-day0-azure-aks-foundation.md
      - "Day 1 · KAI 安裝與 Queue 基礎": runbook/sprint1-day1-kai-queue-basics.md
      - "Day 2 · Gang Scheduling 與搶占": runbook/sprint1-day2-gang-scheduling-preemption.md
      - "Day 3 · HAMi 安裝與 VRAM 硬隔離": runbook/sprint1-day3-hami-memory-isolation.md
      - "Day 4 · HAMi 進階與 KAI 整合": runbook/sprint1-day4-hami-kai-integration.md
      - "Day 5 · HAMi-WebUI 觀測介面": runbook/sprint1-day5-hami-webui.md
      - "Day 6 · DRA 概念與模擬裝置": runbook/sprint1-day6-dra-simulated-devices.md
      - "Day 7 · DRA 真卡實測": runbook/sprint1-day7-dra-aks-real-gpu.md
      - "Day 8 · 綜合:三者分工決策表": runbook/sprint1-day8-decision-matrix.md

  - "Sprint 2 · eBPF 與執行期安全":
      - "Day 0 · eBPF 是什麼": runbook/sprint2-day0-ebpf-concepts.md
      - "Day 1 · bpftrace 三支經典工具": runbook/sprint2-day1-bpftrace-basics.md
      - "Day 2 · 把核心事件接回 Kubernetes": runbook/sprint2-day2-bpftrace-kubernetes.md
      - "Day 3 · Falco 安裝與出廠規則": runbook/sprint2-day3-falco-basics.md
      - "Day 4 · 自訂規則、誤報調校與告警路由": runbook/sprint2-day4-falco-custom-rules.md
      - "Day 5 · Tetragon 與 TracingPolicy": runbook/sprint2-day5-tetragon-basics.md
      - "Day 6 · 從偵測到攔截": runbook/sprint2-day6-tetragon-enforcement.md
      - "Day 7 · Cilium 與 kube-proxy replacement": runbook/sprint2-day7-cilium-kubeproxy.md
      - "Day 8 · CiliumNetworkPolicy(L3/L4 → L7)": runbook/sprint2-day8-cilium-network-policy.md
      - "Day 9 · Hubble 可觀測性": runbook/sprint2-day9-hubble.md
      - "Day 10 · 綜合:四套工具的分工": runbook/sprint2-day10-decision-matrix.md

  - "Sprint 3 · WebAssembly":
      - "Day 0 · wasm 是什麼": runbook/sprint3-day0-wasm-concepts.md
      - "Day 1 · RuntimeClass 七層實測": runbook/sprint3-day1-three-generations.md
      - "Day 2 · wasmCloud 與元件模型": runbook/sprint3-day2-wasmcloud.md
      - "Day 3 · 分散式模型與驗收改寫": runbook/sprint3-day3-wasmcloud-distributed.md
      - "Day 4 · WasmEdge 執行期": runbook/sprint3-day4-wasmedge.md
      - "Day 5 · 成本實測": runbook/sprint3-day5-cost-measurement.md
      - "Day 6 · SpinKube(上):shim 佈建": runbook/sprint3-day6-spinkube-shim.md
      - "Day 7 · SpinKube(下):operator": runbook/sprint3-day7-spinkube-operator.md
      - "Day 8 · 拆得掉嗎:可逆性驗收": runbook/sprint3-day8-reversibility.md
      - "Day 9 · 綜合:三條路線的決策表": runbook/sprint3-day9-decision-matrix.md
