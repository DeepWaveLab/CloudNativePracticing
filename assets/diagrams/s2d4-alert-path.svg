="370" y="112.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Falcosidekick</text><text x="370" y="134.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Deployment</text><ellipse cx="620" cy="121" rx="85" ry="36" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="620" y="112.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">webhook-</text><text x="620" y="132.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">receiver</text><line x1="205" y1="61" x2="290" y2="102" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="205" y1="141" x2="273" y2="121" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="205" y1="221" x2="290" y2="140" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="465" y1="121" x2="533" y2="121" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="370" y="178.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">證據 1：sidekick 日誌</text><text x="370" y="193.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Falco's payload</text><text x="370" y="222.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">證據 2：sidekick 日誌</text><text x="370" y="237.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Webhook - POST OK (200)</text><text x="620" y="178.2" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">證據 3：接收端日誌</text><text x="620" y="193.79999999999998" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">RECEIVED {…}</text><line x1="10" y1="268" x2="710" y2="268" stroke="#222" stroke-width="1" stroke-dasharray="6 5"/><text x="20" y="290.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">Falco 是 DaemonSet：每個節點一份，某一份出問題只影響那個節點。</text><text x="20" y="314.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">sidekick 是 Deployment：所有節點的告警都經過它，它停了就沒有告警送得出去。</text></svg>