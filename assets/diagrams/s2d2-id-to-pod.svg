<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="500" fill="#fff"/><rect x="20" y="14" width="480" height="472" rx="0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="7 5"/><text x="36" y="32.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#555">全部在節點上</text><rect x="50" y="50" width="340" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="220.0" y="66.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">核心事件</text><text x="220.0" y="85.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">execve、openat、tcp_connect 命中</text><line x1="220.0" y1="100" x2="220.0" y2="138" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="232.0" y="119.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">bpftrace 內建變數 cgroup</text><rect x="50" y="140" width="340" height="48" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="220.0" y="156.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cgroup id</text><text x="220.0" y="175.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">一個數字，例如 10431</text><line x1="220.0" y1="190" x2="220.0" y2="228" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="232.0" y="209.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">find -inum &lt;id&gt;（id 就是 inode）</text><rect x="50" y="230" width="340" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="220.0" y="246.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cgroup 目錄路徑</text><text x="220.0" y="265.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">…pod&lt;uid&gt;.slice/cri-containerd-&lt;id&gt;.scope</text><line x1="220.0" y1="280" x2="220.0" y2="318" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="232.0" y="299.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">讀目錄名字</text><rect x="50" y="320" width="340" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="220.0" y="336.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">container id ＋ pod uid</text><text x="220.0" y="355.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">從兩層目錄名字切出來</text><line x1="220.0" y1="370" x2="220.0" y2="408" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="232.0" y="389.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">crictl inspect（問 containerd）</text><rect x="50" y="410" width="340" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="220.0" y="426.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">pod 名字、namespace、容器名字</text><text x="220.0" y="445.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">例如 ebpf-lab/baseline-nginx 的 nginx</text><rect x="530" y="404" width="170" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="615" y="434.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">API server</text><line x1="392" y1="434" x2="528" y2="434" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#s)"/><text x="615" y="482.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">只用來交叉驗證</text></svg>