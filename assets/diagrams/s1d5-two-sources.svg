<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="420" fill="#fff"/><text x="150" y="26.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">配額資料</text><text x="410" y="26.0" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#b26a00">用量資料</text><rect x="30" y="50" width="240" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="150" y="70.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">pod annotation</text><text x="150" y="92.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">hami.io/vgpu-devices-allocated</text><rect x="30" y="150" width="240" height="56" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="150" y="178.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Kubernetes API</text><line x1="150" y1="112" x2="150" y2="148" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="150" y1="208" x2="150" y2="248" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="300" y="50" width="220" height="60" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="410" y="70.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">GPU 節點上的 exporter</text><text x="410" y="92.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">device plugin、dcgm-exporter</text><rect x="300" y="150" width="220" height="56" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="410" y="168.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Prometheus</text><text x="410" y="190.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">照 ServiceMonitor 定期抓取</text><line x1="410" y1="112" x2="410" y2="148" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="410" y1="208" x2="410" y2="248" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="540" y="66.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">① exporter 沒排上</text><text x="540" y="84.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">GPU 節點</text><text x="540" y="166.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">② 標籤被改名，</text><text x="540" y="184.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">查詢對不上</text><text x="540" y="220.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">③ 後端連不上</text><text x="540" y="238.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">Prometheus</text><rect x="30" y="250" width="490" height="56" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="270.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">hami-webui 後端</text><text x="275" y="292.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">讀 Kubernetes API；對 Prometheus 下 PromQL</text><line x1="275" y1="308" x2="275" y2="346" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="175" y="348" width="200" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="370.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">四個頁面</text><text x="540" y="370.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#333">任何一處出錯，</text><text x="540" y="388.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#333">用量欄都只會顯示 0</text></svg>