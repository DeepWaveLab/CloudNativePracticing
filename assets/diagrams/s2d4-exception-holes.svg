<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="360" fill="#fff"/><text x="32" y="24.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">誰、做了什麼</text><text x="475" y="24.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">連到</text><text x="640" y="24.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">規則 A</text><rect x="20" y="44" width="340" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="32" y="63.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">1. legit-client 查 DNS</text><rect x="370" y="44" width="210" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="475" y="63.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.0.10:53/udp</text><rect x="590" y="44" width="110" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="645" y="63.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">不報</text><rect x="20" y="90" width="340" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="32" y="109.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">2. legit-client GET /ping</text><rect x="370" y="90" width="210" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="475" y="109.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.47.134:8080/tcp</text><rect x="590" y="90" width="110" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="645" y="109.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">不報</text><rect x="20" y="136" width="340" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="32" y="155.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">3. baseline-nginx 開 DNS socket</text><rect x="370" y="136" width="210" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="475" y="155.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.0.10:53/udp</text><rect x="590" y="136" width="110" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="645" y="155.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">不報</text><rect x="20" y="182" width="340" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="32" y="201.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">4. baseline-nginx 把 /etc/shadow 塞進 GET</text><rect x="370" y="182" width="210" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="475" y="201.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.47.134:8080/tcp</text><rect x="590" y="182" width="110" height="38" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="645" y="201.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">不報</text><rect x="20" y="228" width="340" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="32" y="247.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">5. baseline-nginx 連 8.8.8.8</text><rect x="370" y="228" width="210" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="475" y="247.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">8.8.8.8:53/tcp</text><rect x="590" y="228" width="110" height="38" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="645" y="247.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">報</text><text x="20" y="300.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">兩條例外比對的是 fd.sip、fd.sport、fd.l4proto：連到哪個 IP、哪個 port、哪種協定。</text><text x="20" y="326.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">誰連的、送了什麼，都不在比對範圍內，所以第 3、4 列跟第 1、2 列一樣放行。</text></svg>