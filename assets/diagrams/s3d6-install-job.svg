<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="470" fill="#fff"/><rect x="90" y="20" width="540" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="41.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kubectl label node … spin=true</text><text x="360" y="63.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">節點開始符合 Shim 的 nodeSelector</text><text x="55" y="51.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">1</text><line x1="360" y1="84" x2="360" y2="108" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="90" y="110" width="540" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="131.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">runtime-class-manager 看到節點變化</text><text x="360" y="153.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">替這台節點建一個 install Job</text><text x="55" y="141.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">2</text><line x1="360" y1="174" x2="360" y2="198" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="90" y="200" width="540" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="221.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">initContainer：downloader</text><text x="360" y="243.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">下載 shim 壓縮檔，比對 sha256，不符就失敗</text><text x="55" y="231.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">3</text><line x1="360" y1="264" x2="360" y2="288" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="90" y="290" width="540" height="62" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="360" y="311.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">container：provisioner（privileged，掛節點根目錄）</text><text x="360" y="333.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">放 shim、在 config.toml 檔尾加設定、寫 rcm-lock.json、重啟 containerd</text><text x="55" y="321.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">4</text><line x1="360" y1="354" x2="360" y2="378" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="90" y="380" width="540" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="401.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">節點標籤 spin-v2=provisioned</text><text x="360" y="423.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">kubectl get shim 的 READY 變成 1</text><text x="55" y="411.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">5</text></svg>