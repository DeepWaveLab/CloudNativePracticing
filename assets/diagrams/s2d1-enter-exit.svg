<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="360" fill="#fff"/><text x="200" y="22.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">進入端 sys_enter_*</text><text x="560" y="22.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">離開端 sys_exit_*</text><text x="20" y="70.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">一次 syscall</text><rect x="200" y="45" width="360" height="50" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="380" y="62.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">核心處理這次 syscall</text><text x="380" y="82.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">進入時只有參數，離開時才有結果</text><line x1="200" y1="95" x2="200" y2="340" stroke="#222" stroke-width="1" stroke-dasharray="4 4"/><line x1="560" y1="95" x2="560" y2="340" stroke="#222" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="145.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">execsnoop</text><rect x="125" y="125" width="150" height="40" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="200" y="145.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">掛這裡：印出 argv</text><rect x="485" y="125" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/><text x="560" y="145.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">沒有掛</text><text x="380" y="145.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">成功、失敗印得一樣</text><text x="20" y="215.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">opensnoop</text><rect x="125" y="195" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="206.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">@filename[tid]</text><text x="200" y="225.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">先存下檔名</text><rect x="485" y="195" width="150" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="560" y="206.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">取出檔名</text><text x="560" y="225.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">連同 FD、ERR 印出</text><line x1="277" y1="222" x2="483" y2="222" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="380" y="207.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">用 tid 對上同一次呼叫</text><text x="20" y="285.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">tcpconnect</text><rect x="280" y="265" width="200" height="40" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="380" y="276.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">kprobe:tcp_connect</text><text x="380" y="295.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">送出 SYN 之前</text><text x="380" y="326.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">握手成不成功還不知道；UDP 的 DNS 不經過這裡</text></svg>