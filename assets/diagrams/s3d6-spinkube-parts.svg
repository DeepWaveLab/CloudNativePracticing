<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="450" fill="#fff"/><line x1="10" y1="210" x2="710" y2="210" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="30.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">叢集側（API server）</text><text x="280" y="232.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">節點側（VM 磁碟與行程）</text><ellipse cx="150" cy="100" rx="115" ry="32" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="150" y="92.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">runtime-class-manager</text><text x="150" y="112.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">controller（今天）</text><rect x="300" y="70" width="150" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="375" y="92.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Shim 資源</text><text x="375" y="113.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">要裝哪支 shim、裝到哪</text><rect x="300" y="148" width="150" height="44" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="375" y="170.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">RuntimeClass</text><line x1="300" y1="100" x2="268" y2="100" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="150" y1="133" x2="298" y2="166" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="480" y="50" width="220" height="92" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/><text x="590" y="74.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">Day 7 使用</text><text x="590" y="98.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">spin-operator</text><text x="590" y="122.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">cert-manager（它的相依）</text><rect x="40" y="270" width="190" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="135" y="290.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">install Job</text><text x="135" y="312.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">每台節點一個</text><line x1="120" y1="134" x2="120" y2="268" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="128" y="190.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">節點符合條件時建立</text><rect x="400" y="252" width="300" height="46" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="550" y="267.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">/opt/rcm/bin/</text><text x="550" y="285.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">containerd-shim-spin-v2</text><line x1="232" y1="300" x2="398" y2="275" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="400" y="306" width="300" height="46" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="550" y="321.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">/etc/containerd/config.toml</text><text x="550"