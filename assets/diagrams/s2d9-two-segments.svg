<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="330" fill="#fff"/><text x="20" y="24.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">GET（放行）：兩段連線</text><ellipse cx="110" cy="80" rx="70" ry="26" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="110" y="80.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">client</text><rect x="280" y="52" width="160" height="56" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="70.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cilium-envoy</text><text x="360" y="92.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">10.244.0.69</text><ellipse cx="610" cy="80" rx="70" ry="26" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="610" y="80.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">echo7</text><line x1="182" y1="80" x2="276" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="229" y="64.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">第一段</text><line x1="442" y1="80" x2="536" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="489" y="64.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">第二段</text><text x="360" y="134.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">Hubble 上兩段都有：client → echo7，以及 10.244.0.69 → echo7</text><line x1="10" y1="160" x2="710" y2="160" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="184.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">POST（被 L7 政策擋下）：只有第一段</text><ellipse cx="110" cy="238" rx="70" ry="26" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="110" y="238.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">client</text><rect x="280" y="210" width="160" height="56" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="360" y="228.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">cilium-envoy</text><text x="360" y="250.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">在這裡回 403</text><rect x="540" y="212" width="140" height="52" rx="26" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/><text x="610" y="238.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#555">echo7</text><line x1="182" y1="226" x2="276" y2="226" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><line x1="278" y1="252" x2="184" y2="252" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="229" y="278.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">403</text><text x="489" y="238.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">沒有轉送</text><text x="360" y="308.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">那筆 403 是 Envoy 產生的，Hubble 卻把它記在 echo7 名下</text></svg>