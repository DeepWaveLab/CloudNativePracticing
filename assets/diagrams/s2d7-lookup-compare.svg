<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="380" fill="#fff"/><text x="20" y="26.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">kube-proxy（iptables 模式）</text><ellipse cx="95" cy="85" rx="75" ry="30" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="95" y="85.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">應用程式</text><line x1="172" y1="85" x2="206" y2="85" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="210" y="55" width="140" height="60" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="280" y="75.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">新連線首包</text><text x="280" y="97.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">進 netfilter</text><line x1="352" y1="85" x2="386" y2="85" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="390" y="55" width="150" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="465" y="75.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">KUBE-SERVICES</text><text x="465" y="97.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">逐條比對 N 條</text><line x1="542" y1="85" x2="576" y2="85" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="580" y="55" width="120" height="60" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="640" y="75.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">KUBE-SEP</text><text x="640" y="97.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">DNAT</text><text x="20" y="145.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#333">Service 越多，KUBE-SERVICES 越長；後續封包由 conntrack 套用既有 NAT 轉換。</text><line x1="10" y1="180" x2="710" y2="180" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><text x="20" y="210.0" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">Cilium socket LB（kube-proxy replacement）</text><ellipse cx="95" cy="270" rx="75" ry="30" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="95" y="270.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">應用程式</text><line x1="172" y1="270" x2="206" y2="270" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="210" y="236" width="260" height="68" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="340" y="258.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">connect() 當下</text><text x="340" y="282.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">cil_sock4_connect 查一次 map</text><line x1="472" y1="270" x2="506" y2="270" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="510" y="236" width="190" height="68" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="605" y="258.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">socket 的目的地</text><text x="605" y="282.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">已是後端 pod IP</text><text x="20" y="340.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#333">每條連線只查一次；之後的每個封包都是一般的 pod 對 pod 流量。</text></svg>