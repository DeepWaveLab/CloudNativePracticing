<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="330" fill="#fff"/><text x="360" y="30.0" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">一組玩家共用一次分配結果</text><rect x="20" y="70" width="200" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="120" y="100.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">兩個 client</text><text x="120" y="128.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">保持 WebSocket 連線</text><rect x="260" y="70" width="200" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="100.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Nakama matchmaker</text><text x="360" y="128.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">決定玩家名單</text><rect x="260" y="220" width="200" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="250.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">matched hook</text><text x="360" y="278.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">取得並通知 endpoint</text><rect x="500" y="220" width="200" height="80" rx="0" fill="#f3f3f3" stroke="#222" stroke-width="1.4"/><text x="600" y="250.0" font-size="16" text-anchor="middle" dominant-baseline="middle" font-w