<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="400" fill="#fff"/><text x="20" y="100.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">system pool</text><text x="20" y="300.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">GPU 節點</text><text x="20" y="320.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">（每台一顆）</text><line x1="10" y1="200" x2="710" y2="200" stroke="#222" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="150" y="30" width="550" height="140" rx="6" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="425" y="50.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">hami-scheduler pod</text><rect x="170" y="70" width="210" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="96.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kube-scheduler</text><text x="275" y="122.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">一般的過濾與打分</text><rect x="470" y="70" width="210" height="80" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="575" y="96.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">vgpu-scheduler-extender</text><text x="575" y="122.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">挑卡、記 VRAM 的帳</text><line x1="382" y1="110" x2="466" y2="110" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="424" y="92.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">GPU 資源</text><text x="424" y="130.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">交給它判斷</text><rect x="150" y="230" width="550" height="140" rx="6" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="425" y="250.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">hami-device-plugin pod</text><rect x="170" y="270" width="210" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="275" y="296.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">device-plugin</text><text x="275" y="322.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">向 kubelet 登記 nvidia.com/gpu</text><rect x="470" y="270" width="210" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="575" y="296.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">vgpu-monitor</text><text x="575" y="322.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">收集各容器的用量</text><line x1="275" y1="172" x2="275" y2="266" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="290" y="218.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">pod 排定節點後，由這台的 device plugin 把卡交給容器</text></svg>