<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="430" fill="#fff"/><ellipse cx="235" cy="36" rx="150" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="235" y="36.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">legit-client 發出一次請求</text><line x1="235" y1="59" x2="235" y2="96" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="252" y="78.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">點數少於 ndots:5，先接上 search 清單去查</text><rect x="60" y="98" width="350" height="36" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="76" y="116.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">&lt;名稱&gt;.&lt;search 網域 1&gt;</text><line x1="410" y1="116" x2="586" y2="116" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="498" y="104.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">查不到</text><line x1="235" y1="135" x2="235" y2="148" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="150" width="350" height="36" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="76" y="168.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">&lt;名稱&gt;.&lt;search 網域 2&gt;</text><line x1="410" y1="168" x2="586" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="498" y="156.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">查不到</text><line x1="235" y1="187" x2="235" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="202" width="350" height="36" rx="0" fill="#fff" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/><text x="76" y="220.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">……（清單裡的每個網域依序試）</text><line x1="410" y1="220" x2="586" y2="220" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="498" y="208.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">查不到</text><line x1="235" y1="239" x2="235" y2="252" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="60" y="254" width="350" height="36" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="76" y="272.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">&lt;名稱&gt;（原本的名字）</text><line x1="410" y1="272" x2="586" y2="272" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="498" y="260.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">10.0.47.134</text><rect x="590" y="94" width="115" height="196" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="647" y="180.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">CoreDNS</text><text x="647" y="202.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.0.10</text><text x="647" y="220.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">UDP 53</text><line x1="235" y1="290" x2="235" y2="326" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="252" y="308.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">拿到位址之後，才建立一條 TCP 連線</text><rect x="60" y="328" width="350" height="36" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="235" y="346.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">10.0.47.134:8080/tcp（接收端的 ClusterIP）</text><text x="20" y="392.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">&lt;名稱&gt; = webhook-receiver.falco.svc.cluster.local</text><text x="20" y="414.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">每一次查詢都經過一個 UDP socket 的 connect()，規則 A 全部看得到。</text></svg>