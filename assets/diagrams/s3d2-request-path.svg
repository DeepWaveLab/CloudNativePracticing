<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="540" fill="#fff"/><ellipse cx="200" cy="40" rx="110" ry="24" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">叢集內的 curl</text><line x1="200" y1="66" x2="200" y2="96" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="80" y="98" width="240" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="116.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Service hello-world</text><text x="200" y="138.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">沒有 selector</text><line x1="200" y1="154" x2="200" y2="184" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="80" y="186" width="240" height="54" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="204.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">EndpointSlice</text><text x="200" y="226.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">只列出載著元件的 host A</text><ellipse cx="560" cy="125" rx="90" ry="24" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="560" y="125.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">runtime-operator</text><line x1="500" y1="143" x2="322" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="405" y="148.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">寫入</text><line x1="200" y1="242" x2="200" y2="282" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="50" y="284" width="300" height="166" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="304.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">host A（pod）</text><rect x="75" y="322" width="250" height="48" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="200" y="346.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Host 標頭 = config.host ?</text><line x1="200" y1="372" x2="200" y2="396" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><ellipse cx="200" cy="420" rx="90" ry="22" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="200" y="420.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">hello-world 元件</text><rect x="420" y="236" width="280" height="52" rx="0" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4"/><text x="560" y="254.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">元件被刪掉：slice 清空</text><text x="560" y="274.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#c0392b">curl: (7) 連不上</text><line x1="418" y1="262" x2="322" y2="217" stroke="#888" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="420" y="320" width="280" height="52" rx="0" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4"/><text x="560" y="338.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">Host 對不上：</text><text x="560" y="358.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#c0392b">404，content-length: 0</text><line x1="418" y1="346" x2="327" y2="346" stroke="#888" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="420" y="410" width="135" height="40" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="487" y="430.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">host B（pod）</text><rect x="565" y="410" width="135" height="40" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="632" y="430.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">host C（pod）</text><text x="560" y="470.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">沒有載元件，不在這份 slice 裡</text><text x="360" y="515.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#333">兩種失敗出現在不同的位置：slice 是空的就連不上，Host 比對不到才是 404。</text></svg>