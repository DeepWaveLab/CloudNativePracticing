"middle" font-weight="normal" fill="#222">只留指定 pod 的 cgroup</text><line x1="255" y1="210" x2="255" y2="154" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="263" y="172.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">過濾後的少量事件</text><text x="555" y="24.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Day 3：Falco</text><rect x="465" y="45" width="180" height="48" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="555" y="69.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">具名告警，印到 stdout</text><ellipse cx="555" cy="130" rx="95" ry="22" fill="#fff7e6" stroke="#f0a020" stroke-width="1.4"/><text x="555" y="130.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">falco：比對規則</text><line x1="555" y1="108" x2="555" y2="95" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="440" y="212" width="230" height="64" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="555" y="233.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">探針（modern_ebpf）</text><text x="555" y="256.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">整台節點、規則用得到的 syscall</text><line x1="555" y1="210" x2="555" y2="154" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="563" y="172.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">經 ring buffer 送上來</text><text x="255" y="302.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">在核心裡就丟掉範圍外的事件</text><text x="555" y="302.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">這些事件都送上來，在使用者空間比對</text></svg>