<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="720" height="345" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="345" fill="#fff"/><text x="20" y="28.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">允許清單漏掉 /usr/bin/head 的 82 秒裡，各處看到的東西</text><rect x="20" y="50" width="160" height="50" rx="4" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="100" y="75.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Kubernetes</text><rect x="220" y="50" width="480" height="50" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460" y="75.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">1/1 Running、RESTARTS 0、沒有新事件</text><line x1="182" y1="75" x2="216" y2="75" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="116" width="160" height="50" rx="4" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="100" y="141.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">應用日誌</text><rect x="220" y="116" width="480" height="50" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460" y="141.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">每筆心跳照樣印出，只是 work=[] 變空</text><line x1="182" y1="141" x2="216" y2="141" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="182" width="160" height="50" rx="4" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="100" y="207.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Tetragon</text><rect x="220" y="182" width="480" height="50" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460" y="207.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">22 筆：/usr/bin/head、SIGKILL、策略名</text><line x1="182" y1="207" x2="216" y2="207" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="248" width="160" height="50" rx="4" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="100" y="273.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Falco</text><rect x="220" y="248" width="480" height="50" rx="4" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="460" y="273.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">22 筆告警，但行程名報成 bash</text><line x1="182" y1="273" x2="216" y2="273" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="20" y="316.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">只有 Tetragon 的事件同時指出被殺的程式與動手的策略。</text></svg>