<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="390" fill="#fff"/><ellipse cx="130" cy="52" rx="95" ry="30" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="130" y="43.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">driver</text><text x="130" y="60.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">（每個節點一個）</text><rect x="30" y="130" width="200" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="130.0" y="150.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">ResourceSlice</text><text x="130.0" y="173.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">這台節點有哪些裝置</text><text x="130.0" y="193.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">由 driver 發佈</text><line x1="130" y1="82" x2="130" y2="128" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="140" y="106.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">發佈</text><rect x="260" y="30" width="200" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360.0" y="50.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">DeviceClass</text><text x="360.0" y="73.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">一條 CEL 框出一類裝置</text><text x="360.0" y="93.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">由管理者建立</text><rect x="260" y="170" width="200" height="80" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="360.0" y="190.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">ResourceClaim</text><text x="360.0" y="213.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">要幾顆、什麼條件</text><text x="360.0" y="233.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">使用者建立，或由 template 產生</text><line x1="360" y1="110" x2="360" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="368" y="140.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">引用類別名稱</text><ellipse cx="620" cy="62" rx="60" ry="30" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="620" y="55.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">Pod</text><text x="620" y="75.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">使用者建立</text><rect x="520" y="170" width="180" height="80" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="610.0" y="190.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">ResourceClaimTemplate</text><text x="610.0" y="213.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">每顆 pod 實體化一份</text><text x="610.0" y="233.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#b26a00">由使用者建立</text><line x1="620" y1="92" x2="620" y2="168" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="628" y="135.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">template 寫法</text><line x1="520" y1="210" x2="462" y2="210" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="491" y="198.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">實體化</text><line x1="566" y1="80" x2="462" y2="180" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="528" y="150.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">具名 claim</text><ellipse cx="360" cy="335" rx="125" ry="32" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="360" y="326.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">kube-scheduler</text><text x="360" y="343.45" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">dynamicresources 外掛</text><line x1="130" y1="212" x2="250" y2="318" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text x="170" y="276.0" font-size="12" text-anchor="end" dominant-baseline="middle" font-weight="normal" fill="#555">讀供給</text><line x1="360" y1="252" x2="360" y2="301" stroke="#222" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#s)"/><text x="370" y="277.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#555">讀需求、寫回配置結果</text></svg>