<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><rect width="720" height="430" fill="#fff"/><rect x="30" y="20" width="330" height="58" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="195.0" y="40.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">ResourceClaim</text><text x="195.0" y="61.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">status.allocation 記著 gpu-0</text><line x1="195.0" y1="80" x2="195.0" y2="102" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="104" width="330" height="58" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="195.0" y="124.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">kubelet plugin（gpu.nvidia.com）</text><text x="195.0" y="145.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">準備裝置，寫出一份宣告檔</text><line x1="195.0" y1="164" x2="195.0" y2="186" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="188" width="330" height="58" rx="0" fill="#fff7e6" stroke="#f0a020" stroke-width="2"/><text x="195.0" y="208.55" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">/var/run/cdi/k8s.gpu.nvidia.com-</text><text x="195.0" y="225.45000000000002" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#222">claim_&lt;claim UID&gt;.yaml</text><line x1="195.0" y1="248" x2="195.0" y2="270" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="272" width="330" height="58" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/><text x="195.0" y="292.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">containerd</text><text x="195.0" y="313.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">cdi_spec_dirs 包含 /var/run/cdi</text><line x1="195.0" y1="332" x2="195.0" y2="354" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect x="30" y="356" width="330" height="58" rx="0" fill="#d4d4d4" stroke="#222" stroke-width="1.4"/><text x="195.0" y="376.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#222">容器</text><text x="195.0" y="397.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#555">/dev/nvidia0 出現，nvidia-smi 看得到 T4</text><text x="390" y="180.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="bold" fill="#222">宣告檔裡寫了三件事：</text><text x="390" y="202.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">・deviceNodes：要掛進容器的 /dev/nvidia0 等</text><text x="390" y="224.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">・env：NVIDIA_VISIBLE_DEVICES=void</text><text x="390" y="246.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222">・hooks：容器建立時執行 create-symlinks</text><line x1="388" y1="213.0" x2="364" y2="213.0" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4"/><text x="390" y="288.0" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">一個 claim 只有一份宣告檔；</text><text x="390" y="310.0" font-size="12" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#b26a00">兩顆 pod 共用 claim 時，同一份檔案注入兩個容器</text></svg>